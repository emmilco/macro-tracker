<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Three vertical bars at different heights — minimal bar chart -->
  <rect width="180" height="180" fill="#0f172a"/>
  <!-- P bar -->
  <rect x="30" y="35" width="30" height="110" rx="6" fill="#2a9d8f"/>
  <!-- C bar -->
  <rect x="75" y="55" width="30" height="90" rx="6" fill="#e9c46a"/>
  <!-- F bar -->
  <rect x="120" y="75" width="30" height="70" rx="6" fill="#e76f51"/>
  <!-- Baseline -->
  <line x1="22" y1="145" x2="158" y2="145" stroke="#334155" stroke-width="2"/>
  <!-- Labels -->
  <text x="45" y="165" font-family="Inter, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">P</text>
  <text x="90" y="165" font-family="Inter, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">C</text>
  <text x="135" y="165" font-family="Inter, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">F</text>
</svg>